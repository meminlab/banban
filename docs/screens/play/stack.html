<h1>반반 쌓기 1인 모드 · 미니게임 메뉴 — 시안 (BANB-50)</h1>
<p class="lead">기준: BANB-2 "같이 놀기" 2차 + BANB-50 1인 모드 명세(2026-11-09), design.md v1.8(1.8 조각 색, 5.32~5.35). 클린 라이트 360×760 + 플레이 클린 다크 1장. 시안 데이터: 나 = 민지(멤버 1, 하늘), 준호(멤버 2, 노랑). <b>판 8칸 × 14줄, 조각 6종(1·2·3·3·4·5칸)</b> — 표준 4칸 7종 세트·10×20 판을 쓰지 않는다.</p>
<div id="rows"></div>
<script>
const ic = (n, s='') => `<i data-lucide="${n}"${s?` style="${s}"`:''}></i>`;
const won = (v, sign='') => `<span class="money">${sign}${Math.abs(v).toLocaleString('ko-KR')}<span style="font-size:.75em;font-weight:600;margin-left:1px">원</span></span>`;
const TABS = [['home','house','홈'],['ledger','notebook-pen','가계부'],['+'],['cal','calendar-heart','일정'],['asset','landmark','자산']];
const tabbar = on => `<div class="tabbar">${TABS.map(t => t[0]==='+' ? `<div class="plus">${ic('plus')}</div>` : `<div class="tab ${t[0]===on?'on':''}"><span class="pill">${ic(t[1])}</span>${t[2]}</div>`).join('')}</div>`;
const hdr = () => `<div class="hdr"><div class="lsw">우리집 가계부 ${ic('chevrons-up-down')}</div><div class="ib">${ic('settings')}</div></div>`;
const P = { m:{n:'민지',i:'민',e:1}, j:{n:'준호',i:'준',e:2} };
const av = (p, size='', st='') => `<span class="av ${size} e-${P[p].e}"${st?` style="${st}"`:''}>${P[p].i}</span>`;

/* ── 조각 세트 (1.8 / 5.32) — 좌표 [x, y], 돌리기 0 ── */
const PIECES = {
  coin1:  { name:'동전',      mat:'coin',   cells:[[0,0]] },
  coin2:  { name:'동전 둘',   mat:'coin',   cells:[[0,0],[1,0]] },
  bill:   { name:'지폐',      mat:'bill',   cells:[[0,0],[1,0],[2,0]] },
  bent:   { name:'꺾인 동전', mat:'coin',   cells:[[0,0],[0,1],[1,1]] },
  wallet: { name:'지갑',      mat:'wallet', cells:[[0,0],[1,0],[0,1],[1,1]], deco:1 },
  piggy:  { name:'저금통',    mat:'piggy',  cells:[[0,0],[1,0],[2,0],[0,1],[2,1]], deco:1 },
};
const rot = (cells, r) => { let c = cells.map(p=>[...p]); for (let k=0;k<r;k++) c = c.map(([x,y])=>[-y,x]); const mx=Math.min(...c.map(p=>p[0])), my=Math.min(...c.map(p=>p[1])); return c.map(([x,y])=>[x-mx,y-my]); };
let PID = 0;
/* grid: Map "x,y" -> {t, id, d} */
function place(G, type, r, ox, oy) { const id = ++PID; const def = PIECES[type]; rot(def.cells, r).forEach(([x,y], i) => G.set(`${ox+x},${oy+y}`, { t:type, mat:def.mat, id, d: def.deco===i })); return G; }
function render(G, { cols=8, rows=14, s=36, ghost=[], glow=[], dots=true, dim=false } = {}) {
  const W = cols*s, H = rows*s; let o = '';
  if (dots) for (let y=1;y<rows;y++) for (let x=1;x<cols;x++) o += `<circle cx="${x*s}" cy="${y*s}" r="1.4" fill="var(--color-stack-dot)"/>`;
  glow.forEach(y => { o += `<rect x="0" y="${y*s}" width="${W}" height="${s}" fill="var(--color-piece-coin)" opacity=".28"/>`; });
  const at = (x,y) => G.get(`${x},${y}`);
  const same = (a,b) => a && b && a.id===b.id;
  const g = Math.max(1.5, s*0.06), rx = s*0.2;
  let outl = '', tiles = '', deco = '', coins = '', bridges = '';
  for (const [k, c] of G) {
    const [x,y] = k.split(',').map(Number); const X = x*s, Y = y*s;
    const R = same(c, at(x+1,y)), D = same(c, at(x,y+1)), L = same(c, at(x-1,y)), U = same(c, at(x,y-1));
    if (c.mat === 'coin') {
      const r = s*0.42, cx = X+s/2, cy = Y+s/2;
      if (R) bridges += `<rect x="${cx}" y="${cy-s*0.17}" width="${s}" height="${s*0.34}" fill="var(--color-piece-coin)" stroke="var(--color-piece-coin-edge)" stroke-width="1.2"/>`;
      if (D) bridges += `<rect x="${cx-s*0.17}" y="${cy}" width="${s*0.34}" height="${s}" fill="var(--color-piece-coin)" stroke="var(--color-piece-coin-edge)" stroke-width="1.2"/>`;
      coins += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="var(--color-piece-coin)" stroke="var(--color-piece-coin-edge)" stroke-width="1.5"/><circle cx="${cx}" cy="${cy}" r="${r*0.6}" fill="none" stroke="var(--color-piece-coin-edge)" stroke-width="1.2" opacity=".55"/>`;
      continue;
    }
    const f = `var(--color-piece-${c.mat})`, ln = `var(--color-piece-${c.mat}-line)`;
    /* 2번 그리기: ① 테두리색 3px 외곽선 → ② 같은 모양 채움. 이어진 칸 사이 선은 ②가 덮어서 덩어리 바깥 테두리만 남는다 */
    const shape = a => { let t = `<rect x="${X+g}" y="${Y+g}" width="${s-2*g}" height="${s-2*g}" rx="${rx}" ${a}/>`;
      if (R) t += `<rect x="${X+s/2}" y="${Y+g}" width="${s}" height="${s-2*g}" ${a}/>`;
      if (D) t += `<rect x="${X+g}" y="${Y+s/2}" width="${s-2*g}" height="${s}" ${a}/>`;
      if (R && D && same(c, at(x+1,y+1))) t += `<rect x="${X+s/2}" y="${Y+s/2}" width="${s}" height="${s}" ${a}/>`; return t; };
    outl += shape(`fill="${ln}" stroke="${ln}" stroke-width="3"`);
    tiles += shape(`fill="${f}"`);
    if (c.mat === 'bill' || c.mat === 'wallet') {
      const i = s*0.2, da = c.mat==='wallet' ? ` stroke-dasharray="${s*0.1} ${s*0.08}"` : '';
      const st = `stroke="${ln}" stroke-width="${c.mat==='wallet'?1.5:1.2}" opacity=".8"${da}`;
      const x0 = X + (L?0:i), x1 = X + s - (R?0:i), y0 = Y + (U?0:i), y1 = Y + s - (D?0:i);
      if (!U) deco += `<line x1="${x0}" y1="${Y+i}" x2="${x1}" y2="${Y+i}" ${st}/>`;
      if (!D) deco += `<line x1="${x0}" y1="${Y+s-i}" x2="${x1}" y2="${Y+s-i}" ${st}/>`;
      if (!L) deco += `<line x1="${X+i}" y1="${y0}" x2="${X+i}" y2="${y1}" ${st}/>`;
      if (!R) deco += `<line x1="${X+s-i}" y1="${y0}" x2="${X+s-i}" y2="${y1}" ${st}/>`;
      if (c.mat==='bill' && ((L && R) || (U && D) || (!L && !R && !U && !D))) deco += `<circle cx="${X+s/2}" cy="${Y+s/2}" r="${s*0.16}" fill="none" stroke="${ln}" stroke-width="1.2" opacity=".8"/>`;
    }
    if (c.d && c.mat === 'wallet') deco += `<rect x="${X+s-s*0.34}" y="${Y+s-s*0.16}" width="${s*0.3}" height="${s*0.32}" rx="${s*0.08}" fill="${ln}"/>`;
    if (c.d && c.mat === 'piggy') deco += `<line x1="${X+s*0.3}" y1="${Y+s*0.32}" x2="${X+s*0.7}" y2="${Y+s*0.32}" stroke="${ln}" stroke-width="${Math.max(2,s*0.08)}" stroke-linecap="round"/><circle cx="${X+s*0.5}" cy="${Y+s*0.64}" r="${s*0.06}" fill="${ln}" opacity=".7"/>`;
  }
  const gh = ghost.map(([x,y]) => `<rect x="${x*s+g+1}" y="${y*s+g+1}" width="${s-2*g-2}" height="${s-2*g-2}" rx="${rx}" fill="none" stroke="var(--color-stack-ghost)" stroke-width="1.5" stroke-dasharray="4 3"/>`).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"${dim?' opacity=".35"':''} role="img" aria-label="반반 쌓기 판">${o}${gh}${outl}${tiles}${deco}${bridges}${coins}</svg>`;
}
const mini = (type, r=0, s=14) => { const G = new Map(); place(G, type, r, 0, 0); const c = rot(PIECES[type].cells, r); const w = Math.max(...c.map(p=>p[0]))+1, h = Math.max(...c.map(p=>p[1]))+1; return render(G, { cols:w, rows:h, s, dots:false }); };

/* 샘플 판 */
function baseStack() {
  const G = new Map();
  place(G,'wallet',0,0,12); place(G,'bill',0,2,13); place(G,'coin2',0,5,13);
  place(G,'piggy',0,2,11); place(G,'bent',0,5,11);
  place(G,'wallet',0,0,10); place(G,'coin1',0,6,11); place(G,'coin1',0,4,10);
  return G;
}
const G1 = place(baseStack(), 'bill', 1, 7, 3);           /* 지폐 세로로 떨어지는 중 */
const ghost1 = [[7,11],[7,12],[7,13]];
const G2 = place(baseStack(), 'bill', 1, 7, 11);          /* 막 놓임 → 맨 아랫줄 꽉 참 */
function topStack() { /* 끝: 맨 위까지 찬 판 */
  const G = new Map(); const T = ['coin1','coin2','bill','bent','wallet','piggy'];
  const plan = [['wallet',0,0,12],['bill',0,2,13],['coin2',0,5,13],['piggy',0,2,11],['bent',0,5,11],['wallet',0,0,10],['coin1',0,6,11],['coin1',0,4,10],
    ['bill',1,7,10],['piggy',2,1,8],['coin2',1,5,8],['bent',1,6,8],['wallet',0,3,6],['bill',0,0,7],['coin1',0,7,7],['piggy',0,4,4],['bent',3,0,5],['coin2',0,2,5],['bill',1,7,4],['wallet',0,1,2],['coin2',1,3,1],['bent',0,4,2],['coin1',0,6,3],['bill',1,5,0]];
  plan.forEach(p => place(G, ...p)); return G;
}

/* ── 플레이 화면 ── */
const shdr = (right=`<span class="ib" aria-label="일시정지">${ic('pause')}</span>`, title='반반 쌓기') => `<div class="sh"><span class="ib">${ic('chevron-left')}</span><b>${title}</b>${right}</div>`;
const sinfo = (money, lines, lv, next) => `<div class="sinfo"><div><div class="lab">모은 돈</div><div class="val">${won(money)}</div></div><div class="meta">저금한 줄 <b class="num">${lines}</b><br>속도 <b class="num">${lv}</b></div><div class="nextbox">${next ? mini(next, 0, 13) : ''}<span>다음</span></div></div>`;
const ctrl = () => `<div class="ctrl"><span aria-label="왼쪽">${ic('chevron-left')}</span><span class="main" aria-label="돌리기">${ic('rotate-cw')}</span><span aria-label="오른쪽">${ic('chevron-right')}</span><span aria-label="바로 내리기">${ic('arrow-down-to-line')}</span></div>`;
const play = ({ G, ghost=[], glow=[], money, lines, lv, next, extra='', dim=false, right }) => `<div class="phone">${shdr(right)}<div class="gamebg"></div>${sinfo(money, lines, lv, next)}<div class="sboard">${render(G, { ghost, glow, dim })}</div>${ctrl()}${extra}</div>`;

const p1 = play({ G:G1, ghost:ghost1, money:11000, lines:11, lv:2, next:'piggy' });
const p2 = play({ G:G2, glow:[13], money:12000, lines:12, lv:2, next:'piggy', extra:`<div class="cheer">${ic('coins')}한 줄 저금했어요!</div><span class="plus1k" style="left:118px;top:604px">+1,000원</span>` });

/* 일시정지 */
const pauseSheet = (fromBg=false) => `<div class="scrim"></div><div class="sheet" role="dialog"><div class="grab"></div><div class="res" style="padding-top:20px">
  <div class="circ">${ic(fromBg?'smartphone':'pause')}</div><h3>${fromBg?'앱을 나가서 잠시 멈췄어요':'잠깐 쉬는 중이에요'}</h3><p>모은 돈 <b style="color:var(--color-text)">${won(12000)}</b> · 저금한 줄 <b class="num" style="color:var(--color-text)">12</b></p></div>
  <div class="btns" style="padding:20px 16px 0"><div class="btn2">그만하기</div><div class="btn1" style="flex:1.4">${ic('play')}이어서 하기</div></div>
  <p style="text-align:center;font-size:13px;color:var(--color-text-sub);margin:12px 0 0">이어서 하면 3초 뒤에 다시 떨어져요</p></div>`;
const pz1 = play({ G:G2, money:12000, lines:12, lv:2, next:'piggy', dim:true, extra:pauseSheet() });
const pz2 = play({ G:G2, money:12000, lines:12, lv:2, next:'piggy', dim:true, extra:pauseSheet(true) });
const pz3 = play({ G:G2, money:12000, lines:12, lv:2, next:'piggy', dim:true, extra:`<div class="cnt num">3</div>` });

/* 끝 */
const endSheet = (best=false) => `<div class="scrim" style="background:rgb(15 16 18 / .25)"></div><div class="sheet" role="dialog"><div class="grab"></div><div class="res" style="padding-top:20px">
  <div class="circ ${best?'p':''}">${ic(best?'trophy':'piggy-bank')}</div>
  <h3>${best?'새 최고 기록이에요!':'아쉽지만 여기까지예요'}</h3>
  <div class="big" style="margin-top:8px">${won(best?36000:12000)}</div>
  <p style="margin-top:2px">저금한 줄 <b class="num" style="color:var(--color-text)">${best?30:12}</b> · 속도 <b class="num" style="color:var(--color-text)">${best?4:2}</b></p>
  <div class="rec">${av('j','', 'width:24px;height:24px;font-size:11px')}<span>${best?'준호님 기록 <b class="num">32,000원</b>을 넘었어요':'준호님 최고 기록 <b class="num">32,000원</b>이에요'}</span></div>
  ${best?'':`<p class="note">내 최고 기록 <b class="num">28,000원</b></p>`}</div>
  <div class="btns" style="padding:16px 16px 0"><div class="btn2">그만하기</div><div class="btn1" style="flex:1.4">${ic('rotate-ccw')}한 판 더</div></div></div>`;
const e1 = play({ G:topStack(), money:12000, lines:12, lv:2, next:'coin2', right:'<span style="width:44px"></span>', extra:endSheet() });
const e2 = play({ G:topStack(), money:36000, lines:30, lv:4, next:'coin2', right:'<span style="width:44px"></span>', extra:endSheet(true) });

/* ── 시작 화면 (반반 쌓기) ── */
const intro = (empty=false) => { const G = new Map(); place(G,'wallet',0,0,2); place(G,'bill',0,2,3); place(G,'coin2',0,5,3); place(G,'piggy',0,2,1); place(G,'bent',0,5,1); place(G,'coin1',0,7,3);
  return `<div class="phone">${shdr('', '반반 쌓기')}<div class="scroll" style="bottom:80px"><div class="stack" style="padding-top:12px">
  <div class="card" style="padding:20px 20px 16px"><div style="display:flex;justify-content:center;background:var(--color-stack-board);border-radius:12px;padding:12px 0">${render(G, { rows:4, s:26 })}</div>
    <div class="t18" style="margin-top:14px">동전·지폐를 쌓아 한 줄을 채우면<br>저금돼요</div><div class="sub">맨 위까지 쌓이면 끝나요. 한 줄에 1,000원!</div></div>
  <div class="card" style="padding:16px 20px">
    <div class="k">내 최고 기록</div>
    ${empty?`<div class="t18">아직 기록이 없어요</div><div class="sub">첫 판을 해 볼까요?</div>`:`<div class="big">${won(28000)}</div>`}
    <div class="rec" style="justify-content:flex-start;padding:0 12px;margin-top:12px">${av('j','', 'width:24px;height:24px;font-size:11px')}<span>준호님 최고 기록 <b class="num">32,000원</b>이에요</span></div></div>
  <div class="card" style="padding:16px 20px"><div class="k">이렇게 해요</div><div class="howto">
    <div>${ic('move-horizontal')}좌우로 밀거나 ‹ › 눌러 옮겨요</div>
    <div>${ic('rotate-cw')}판을 톡 누르면 돌아가요</div>
    <div>${ic('arrow-down-to-line')}아래로 밀면 바로 내려가요</div></div></div>
</div></div><div class="fix"><div class="btn1">${ic('play')}시작하기</div></div></div>`; };

/* ── 미니게임 메뉴 ── */
const settings = `<div class="phone"><div class="sh"><span class="ib">${ic('chevron-left')}</span><b>설정</b></div><div class="scroll" style="bottom:0"><div class="stack" style="padding-top:12px">
  <div class="card" style="padding:4px 0">${[['pencil','가계부 이름','우리집 가계부'],['user-round','내 이름','민지'],['heart-handshake','함께한 날','2021년 6월 12일'],['users','멤버·초대',''],['shapes','카테고리',''],['wallet-cards','주머니',''],['repeat','정기 내역','']].map(([i,t,v])=>`<div class="srow">${ic(i)}<span>${t}</span><span class="v">${v}${ic('chevron-right')}</span></div>`).join('')}</div>
  <div class="card" style="padding:4px 0">${[['book-copy','가계부 관리',''],['palette','화면 테마','클린'],['gamepad-2','미니게임','']].map(([i,t,v])=>`<div class="srow ${t==='미니게임'?'new':''}">${ic(i)}<span>${t}</span><span class="v">${v}${ic('chevron-right')}</span></div>`).join('')}</div>
  <div class="card" style="padding:4px 0"><div class="srow"><span style="font-size:15px;color:var(--color-text-sub)">minji@example.com</span><span class="v" style="color:var(--color-text);font-weight:600">로그아웃</span></div></div>
</div></div></div>`;
const menu = (ongoing=false) => `<div class="phone"><div class="sh"><span class="ib">${ic('chevron-left')}</span><b>미니게임</b></div><div class="scroll" style="bottom:0"><div class="stack" style="padding-top:12px">
  ${ongoing?`<div class="card" style="padding:16px 20px"><div class="k">두던 판이 있어요</div><div class="t18">준호님과 오목 · <span class="acc">내 차례예요</span></div><div class="btn1 m" style="margin-top:12px">이어서 두기</div></div>`:''}
  <div class="card" style="padding:8px 0"><p class="sect" style="padding-top:8px">둘이 같이</p>
    <div class="lrow ${ongoing?'dis':''}" style="min-height:72px"><span class="ic" style="width:48px;height:48px">${ic('grid-3x3','width:24px;height:24px')}</span><div class="t"><b>오목</b><span>${ongoing?'두던 판을 끝내면 새로 둘 수 있어요':'준호님과 <b style="display:inline;font-size:13px;font-weight:700" class="num">3승 2패 1무</b>'}</span></div><span class="go">${ic('chevron-right')}</span></div>
    <p class="sect" style="padding-top:8px">혼자서</p>
    <div class="lrow" style="min-height:72px"><span class="ic" style="width:48px;height:48px">${ic('piggy-bank','width:24px;height:24px')}</span><div class="t"><b>반반 쌓기</b><span>내 최고 <b style="display:inline;font-size:13px;font-weight:700" class="num">28,000원</b></span></div><span class="go">${ic('chevron-right')}</span></div></div>
  <div class="card" style="padding:4px 0"><div class="srow">${ic('vibrate')}<div style="flex:1"><div>진동</div><div style="font-size:13px;color:var(--color-text-sub)">줄을 저금하거나 끝날 때 짧게 울려요</div></div><span class="sw"></span></div></div>
</div></div></div>`;
const recentRows = `<div class="card" style="padding:20px 0 8px"><div class="k" style="padding:0 20px">최근 내역<span class="go">${ic('chevron-right')}</span></div>
  ${[['utensils','점심','식비 · 민지',12000],['coffee','커피','카페 · 준호',4500],['shopping-cart','장보기','생활 · 민지',38200]].map(([i,t,s,v])=>`<div class="lrow" style="min-height:60px"><span class="ic">${ic(i)}</span><div class="t"><b style="font-size:15px">${t}</b><span>${s}</span></div><b style="font-size:16px">${won(v,'−')}</b></div>`).join('')}</div>`;
const idleRow = `<div class="ncard">${ic('gamepad-2','color:var(--color-primary)')}<span>같이 놀기</span><span class="s">오목 · 반반 쌓기</span><span class="go">${ic('chevron-right')}</span></div>`;
