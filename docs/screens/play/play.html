<h1>반반 같이 놀기 (오목 1차) — 시안 (BANB-48)</h1>
<p class="lead">기준: BANB-2 "미니게임 '같이 놀기' 명세"(클라이언트 승인 2026-11-09), design.md v1.7(1.7 게임 색, 5.28~5.31). 클린 라이트 360×760 + 오목 판 클린 다크 1장. 시안 데이터: 멤버 민지(멤버 1, 하늘)·준호(멤버 2, 노랑). 설명이 따로 없으면 <b>민지 폰</b> 화면이고, 민지가 준호를 초대했으므로 <b>준호 = 흑(먼저)</b>, 민지 = 백.</p>
<div id="rows"></div>
<script>
const ic = (n, s='') => `<i data-lucide="${n}"${s?` style="${s}"`:''}></i>`;
const won = (v, sign='') => `<span class="money">${sign}${Math.abs(v).toLocaleString('ko-KR')}<span style="font-size:.75em;font-weight:600;margin-left:1px">원</span></span>`;
const TABS = [['home','house','홈'],['ledger','notebook-pen','가계부'],['+'],['cal','calendar-heart','일정'],['asset','landmark','자산']];
const tabbar = on => `<div class="tabbar">${TABS.map(t => t[0]==='+' ? `<div class="plus">${ic('plus')}</div>` : `<div class="tab ${t[0]===on?'on':''}"><span class="pill">${ic(t[1])}</span>${t[2]}</div>`).join('')}</div>`;
const hdr = () => `<div class="hdr"><div class="lsw">우리집 가계부 ${ic('chevrons-up-down')}</div><div class="ib">${ic('settings')}</div></div>`;
/* 사람: 이니셜 + 일정 색 + 돌 */
const P = { m:{n:'민지',i:'민',e:1}, j:{n:'준호',i:'준',e:2} };
const av = (p, stone='', size='') => `<span class="av ${size} e-${P[p].e}">${P[p].i}${stone?`<i class="st ${stone}"></i>`:''}</span>`;

/* ── 오목 판 SVG ── */
const N = 15, PAD = 12, STEP = 320/14;
const X = i => PAD + i*STEP;
function board({ b=[], w=[], last=null, sel=null, mine='w', win=null, zoom=null, full=false, dimOthers=false } = {}) {
  let s = '';
  const vb = zoom ? `${X(zoom[0]-4)-STEP/2} ${X(zoom[1]-4)-STEP/2} ${STEP*9} ${STEP*9}` : '0 0 344 344';
  for (let i=0;i<N;i++){ s += `<line x1="${X(0)}" y1="${X(i)}" x2="${X(14)}" y2="${X(i)}"/><line x1="${X(i)}" y1="${X(0)}" x2="${X(i)}" y2="${X(14)}"/>`; }
  let g = `<g stroke="var(--color-game-line)" stroke-width="${zoom?0.75:1}">${s}</g>`;
  g += [[3,3],[3,11],[11,3],[11,11],[7,7]].map(([x,y])=>`<circle cx="${X(x)}" cy="${X(y)}" r="${zoom?2:2.5}" fill="var(--color-game-line)"/>`).join('');
  if (sel) g += `<g stroke="var(--color-primary)" stroke-width="${zoom?1.2:1.5}" opacity=".75"><line x1="${X(0)}" y1="${X(sel[1])}" x2="${X(14)}" y2="${X(sel[1])}"/><line x1="${X(sel[0])}" y1="${X(0)}" x2="${X(sel[0])}" y2="${X(14)}"/></g>`;
  let stones = [];
  if (full) { for (let y=0;y<N;y++) for (let x=0;x<N;x++) stones.push([x,y,((x>>1)+y)%2?'w':'b']); }
  else { b.forEach(p=>stones.push([...p,'b'])); w.forEach(p=>stones.push([...p,'w'])); }
  const isWin = (x,y) => win && win.some(p=>p[0]===x&&p[1]===y);
  g += stones.map(([x,y,c]) => {
    const op = dimOthers && win && !isWin(x,y) ? ' opacity=".45"' : '';
    return `<g${op}><circle cx="${X(x)}" cy="${X(y)}" r="10" fill="var(--color-stone-${c==='b'?'black':'white'})" stroke="var(--color-stone-edge)" stroke-width="1"/>${c==='b'?`<circle cx="${X(x)-3}" cy="${X(y)-3}" r="3" fill="#fff" opacity=".14"/>`:''}</g>`;
  }).join('');
  if (last) g += `<circle cx="${X(last[0])}" cy="${X(last[1])}" r="13" fill="none" stroke="var(--color-primary)" stroke-width="2"/>`;
  if (win) { g += `<line x1="${X(win[0][0])}" y1="${X(win[0][1])}" x2="${X(win[win.length-1][0])}" y2="${X(win[win.length-1][1])}" stroke="var(--color-primary)" stroke-width="3" stroke-linecap="round" opacity=".9"/>`; g += win.map(([x,y])=>`<circle cx="${X(x)}" cy="${X(y)}" r="13" fill="none" stroke="var(--color-primary)" stroke-width="2.5"/>`).join(''); }

  return `<svg class="bd" viewBox="${vb}" role="grid" aria-label="오목 판 15×15">${g}</svg>`;
