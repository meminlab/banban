<h1>반반 일정 탭 · 탭바 4개 · 홈 함께한 날 카드 · 정기 내역 — 시안 (BANB-41)</h1>
<p class="lead">기준: BANB-2 "일정 캘린더 명세" + "일정 명세 보강"(클라이언트 승인 2026-11-09), design.md v1.6(5.7 탭바, 1.6 일정 색, 5.24~5.27). 클린 라이트 360×760 + 일정 탭 클린 다크 1장. 데이터는 시안용 샘플(오늘 = 2026년 11월 9일 월요일, 멤버 민지·준호). 노란 바탕 줄 = 이번에 새로 생기는 설정 행.</p>
<div id="rows"></div>
<script>
const ic = (n, s='') => `<i data-lucide="${n}"${s?` style="${s}"`:''}></i>`;
const won = (v, sign='') => `<span class="money">${sign}${Math.abs(v).toLocaleString('ko-KR')}<span class="u">원</span></span>`;
const TABS = [['home','house','홈'],['ledger','notebook-pen','가계부'],['+'],['cal','calendar-heart','일정'],['asset','landmark','자산']];
const tabbar = on => `<div class="tabbar">${TABS.map(t => t[0]==='+' ? `<div class="plus">${ic(on==='cal'?'calendar-plus':'plus')}</div>` : `<div class="tab ${t[0]===on?'on':''}"><span class="pill">${ic(t[1])}</span>${t[2]}</div>`).join('')}</div>`;
const hdr = () => `<div class="hdr"><div class="lsw">우리집 가계부 ${ic('chevrons-up-down')}</div><div class="ib">${ic('settings')}</div></div>`;
const month = () => `<div class="mrow"><span class="ib">${ic('chevron-left')}</span>11월<span class="ib">${ic('chevron-right')}</span></div>`;
const KIND = { anniversary:'heart', appointment:'clock', bill_day:'receipt', other:null };
const KNAME = { anniversary:'기념일', appointment:'약속', bill_day:'정기 지출일', other:'기타' };
const WHO = { t:'함께', 1:'민지', 2:'준호' };

/* 11월 샘플 일정 (반복은 펼친 결과) */
const EV = {
  2:[['1','요가','appointment']], 3:[['2','치과','appointment']], 5:[['rec','−1.7만']], 7:[['t','캠핑 예약','appointment']],
  9:[['1','요가','appointment'],['rec','−6.9만']], 11:[['t','아버님 제사','anniversary']],
  14:[['t','결혼기념일','anniversary'],['t','레스토랑','appointment'],['2','풋살','other'],['1','대학 동기 송년회 겸 연말 선물 교환','appointment']],
  16:[['1','요가','appointment']], 21:[['2','준호 생일','anniversary'],['2','풋살','other']], 23:[['1','요가','appointment']],
  25:[['rec','−25만'],['rec','+350만',1]], 27:[['t','카드값','bill_day']], 28:[['2','풋살','other']], 30:[['1','요가','appointment']],
};
const chip = e => e[0]==='rec' ? `<div class="chip rec${e[2]?' acc':''}">${e[1]}</div>` : `<div class="chip e-${e[0]}">${KIND[e[2]]?ic(KIND[e[2]]):''}<span class="tt">${e[1]}</span></div>`;
