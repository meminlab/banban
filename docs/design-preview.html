[data-theme="cozy"][data-mode="dark"]{--color-bg:#171312;--color-surface:#221C1A;--color-surface-sunken:#2E2624;--color-border:#3D3330;--color-border-strong:#85766F;--color-text:#F5EEEB;--color-text-sub:#C4B6B1;--color-text-weak:#A39590;--color-primary:#FF8A74;--color-primary-pressed:#F27560;--color-primary-strong:#FFB3A3;--color-primary-soft:#3D211C;--color-on-primary:#1F0E0B;--color-inverse-action:#9E3226;--color-saving:#93C4AD;--color-hero-bg:#3D211C;--color-hero-label:#FFB3A3;--color-member-1:#E89A84;--color-member-2:#D9B95F;--color-member-3:#8FB07F;--color-member-4:#9F97D6;--color-avatar-1:#E89A84;--color-avatar-2:#D9B95F;--color-avatar-3:#8FB07F;--color-avatar-4:#9F97D6;--color-on-avatar:#1F1715;--color-income:#9DB2DC;--color-negative:#EE8F99;--card-shadow:none;}

/* ── 공통 ── */
* { box-sizing: border-box; }
body { margin:0; padding: 28px; background:#D9DBDF; font-family:'Pretendard Variable',Pretendard,-apple-system,system-ui,sans-serif; word-break: keep-all; color:#1D1F23; }
body.dark { background:#0B0C0D; color:#E8E9EB; }
h1 { font-size: 24px; margin: 0 0 4px; } .lead { margin: 0 0 24px; font-size: 15px; opacity: .8; }
.themes { display:flex; gap: 36px; align-items:flex-start; }
.theme-col h2 { font-size: 18px; margin: 0 0 2px; } .theme-col p.d { margin: 0 0 12px; font-size: 13px; opacity: .8; }
.pair { display:flex; gap: 16px; }
.phone { width:360px; height:760px; position:relative; overflow:hidden; border-radius: 28px; box-shadow: 0 10px 36px rgb(0 0 0 / .2);
  background: var(--color-bg); color: var(--color-text); font-family: inherit; letter-spacing: -0.005em; }
.num, .money { font-variant-numeric: tabular-nums; white-space: nowrap; }
svg.lucide { width:20px; height:20px; stroke-width:2; flex:none; }
.ib { width:44px; height:44px; display:flex; align-items:center; justify-content:center; color: var(--color-text-sub); }
/* 헤더 */
.hdr { height:56px; background: var(--color-surface); display:flex; align-items:center; justify-content:space-between; padding: 0 8px 0 12px; }
.switch { display:flex; align-items:center; gap:8px; height:40px; padding:0 10px 0 5px; border-radius:999px; background: var(--color-surface-sunken); }
.switch .av { border-color: var(--color-surface-sunken); width:28px; height:28px; font-size:12px; }
.avs { display:flex; } .av { width:30px; height:30px; border-radius:999px; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; color: var(--color-on-avatar); border: 2px solid var(--color-surface); }
.av + .av { margin-left:-10px; }
.switch .nm { font-weight:700; font-size:16px; line-height:22px; display:flex; align-items:center; gap:2px; }
.switch .nm svg { width:18px; height:18px; color: var(--color-text-sub); }
.switch small { display:block; font-size:12px; line-height:16px; color: var(--color-text-sub); font-weight:500; }
/* 카드 */
.scroll { padding: 12px 0 90px; display:flex; flex-direction:column; gap: 12px; }
.card { margin: 0 var(--card-gutter); background: var(--color-surface); border-radius: var(--card-radius); padding: 24px 20px; box-shadow: var(--card-shadow); }
[data-mode="dark"] .card { border: 1px solid var(--color-border); }
[data-theme="clean"][data-mode="dark"] .card { border-left:0; border-right:0; }
.card.hero { background: var(--color-hero-bg); }
.month { display:flex; align-items:center; gap:2px; font-size:15px; font-weight:600; color: var(--color-hero-label); margin: -6px 0 10px -6px; }
.month svg { width:18px; height:18px; }
.lbl { font-size:15px; font-weight:500; color: var(--color-hero-label); }
.hero-amt { font-size:36px; line-height:44px; font-weight:700; letter-spacing:-0.02em; margin: 4px 0 20px; }
.unit { font-size:.75em; font-weight:600; margin-left:1px; }
.trio { display:grid; grid-template-columns: repeat(3,1fr); gap:8px; }
.trio .k { font-size:13px; font-weight:500; color: var(--color-hero-label); } .trio .v { font-size:16px; font-weight:700; margin-top:2px; }
.sec { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
.sec b { font-size:17px; } .sec a { font-size:14px; font-weight:600; color: var(--color-primary); }
.split { display:flex; gap:3px; height:12px; margin-bottom: 14px; } .split div { border-radius:999px; }
.mrow { display:flex; align-items:center; gap:10px; padding: 5px 0; font-size:15px; }
.mrow .av { width:28px; height:28px; border:0; font-size:12px; } .mrow .dot { width:8px; height:8px; border-radius:2px; }
.mrow .amt { margin-left:auto; font-weight:700; font-size:16px; } .mrow .pct { width:38px; text-align:right; font-size:13px; color: var(--color-text-sub); }
.bar { margin-bottom: 12px; } .bar .t { display:flex; justify-content:space-between; font-size:15px; margin-bottom:6px; } .bar .t b { font-weight:700; }
.track { height:8px; border-radius:999px; background: var(--color-surface-sunken); } .fill { height:8px; border-radius:999px; background: var(--color-primary); }
/* 탭바 */
.tabbar { position:absolute; left:0; right:0; bottom:0; height:64px; background: var(--color-surface); border-top: 1px solid var(--color-border); display:flex; align-items:center; padding: 0 8px; }
.tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; font-weight:500; color: var(--color-text-sub); }
.tab .pill { width:56px; height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center; }
.tab.on { color: var(--color-text); font-weight:700; } .tab.on .pill { background: var(--color-primary-soft); color: var(--color-primary-strong); }
.plus { width:52px; height:52px; border-radius: 18px; background: var(--color-primary); color: var(--color-on-primary); display:flex; align-items:center; justify-content:center; margin: 0 6px; }
.plus svg { width:26px; height:26px; }
/* 입력 */
.in-h { height:56px; display:flex; align-items:center; justify-content:space-between; padding: 0 8px; background: var(--color-surface); }
.in-h b { font-size:17px; }
.seg { display:grid; grid-template-columns: repeat(3,1fr); background: var(--color-surface-sunken); border-radius: var(--control-radius); padding:4px; margin: 0 16px; height:48px; }
.seg span { display:flex; align-items:center; justify-content:center; border-radius: calc(var(--control-radius) - 3px); font-weight:600; font-size:15px; color: var(--color-text-sub); }
.seg span.on { background: var(--color-surface); color: var(--color-text); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.amt-area { padding: 18px 20px 6px; }
.amt-area .q { font-size:15px; color: var(--color-text-sub); }
.amt-area .v { font-size:40px; line-height:48px; font-weight:700; letter-spacing:-0.03em; margin-top:4px; }
.caret { display:inline-block; width:2px; height:36px; background: var(--color-primary); vertical-align:-3px; margin-left:3px; }
.amt-area .ko { font-size:14px; color: var(--color-text-weak); margin-top:2px; }
.quick { display:flex; gap:8px; padding: 8px 16px 0; }
.quick span { flex:1; height:36px; display:flex; align-items:center; justify-content:center; border-radius: 999px; background: var(--color-surface); border: 1px solid var(--color-border); font-size:14px; font-weight:600; }
.rows { margin: 12px 16px 0; background: var(--color-surface); border-radius: var(--control-radius); padding: 0 14px; }
[data-mode="dark"] .rows { border: 1px solid var(--color-border); }
.rw { height:44px; display:flex; align-items:center; justify-content:space-between; font-size:15px; }
.rw + .rw { border-top: 1px solid var(--color-border); }
.rw .k { color: var(--color-text-sub); } .rw .v { font-weight:600; display:flex; align-items:center; gap:6px; }
.rw .v svg { width:16px; height:16px; } .rw .v .chev { color: var(--color-text-weak); }
.rw .v .av { width:22px; height:22px; font-size:11px; border:0; }
.pad { position:absolute; left:8px; right:8px; bottom:84px; display:grid; grid-template-columns: repeat(3,1fr); }
.pad span { height:44px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:600; border-radius: var(--control-radius); }
.save { position:absolute; left:16px; right:16px; bottom:16px; height:54px; border-radius: var(--control-radius); background: var(--color-primary); color: var(--color-on-primary); font-weight:700; font-size:17px; display:flex; align-items:center; justify-content:center; }
/* 컴포넌트 띠 */
.comps { margin-top: 16px; width: 736px; border-radius: 20px; padding: 18px; background: var(--color-bg); color: var(--color-text); display:grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; box-shadow: 0 6px 20px rgb(0 0 0 / .12); }
.comps .k { font-size:12px; font-weight:700; color: var(--color-text-sub); margin-bottom:8px; }
.btns { display:flex; gap:8px; flex-wrap:wrap; }
.btn { height:44px; padding: 0 16px; border-radius: var(--control-radius); display:inline-flex; align-items:center; font-weight:600; font-size:15px; }
.btn.p { background: var(--color-primary); color: var(--color-on-primary); }
.btn.s { background: var(--color-surface); color: var(--color-text); border: 1px solid var(--color-border-strong); }
.btn.t { color: var(--color-primary); padding: 0 8px; }
.btn.x { background: var(--color-danger, #B23A48); background: var(--color-negative); color: var(--color-on-primary); }
.chips { display:flex; gap:8px; flex-wrap:wrap; }
.chip { height:36px; padding: 0 12px; border-radius:999px; display:inline-flex; align-items:center; gap:4px; font-size:14px; background: var(--color-surface); border:1px solid var(--color-border-strong); }
.chip.on { background: var(--color-primary-soft); color: var(--color-primary-strong); border-color: var(--color-primary); font-weight:600; }
.chip svg { width:16px; height:16px; }
.badge { height:22px; padding:0 7px; border-radius:8px; display:inline-flex; align-items:center; gap:3px; font-size:12px; font-weight:600; background: var(--color-surface-sunken); color: var(--color-text-sub); margin-right:6px; }
.badge.p { background: var(--color-primary-soft); color: var(--color-primary-strong); }
.badge svg { width:12px; height:12px; }
.toast { display:inline-flex; align-items:center; gap:8px; height:44px; padding: 0 18px; border-radius:999px; background: var(--color-text); color: var(--color-surface); font-size:14px; font-weight:500; }
.toast b { color: var(--color-inverse-action); margin-left: 6px; }
.money-demo { display:flex; gap:14px; font-weight:700; font-size:17px; flex-wrap:wrap; }
</style></head>
<body>
<h1 id="ttl">반반 디자인 시스템 v1.2 — 테마 3종 (라이트)</h1>
<p class="lead">화면 구조·컴포넌트는 하나, 테마는 색·바탕·강조 표현만 다르다. 기본 테마 = 클린.</p>
<div class="themes" id="themes"></div>
<template id="tpl">
<div class="theme-col">
  <h2 class="tn"></h2><p class="d td"></p>
  <div class="pair">
   <div class="phone">
    <div class="hdr"><div class="switch"><span class="avs"><span class="av" style="background:var(--color-avatar-1)">민</span><span class="av" style="background:var(--color-avatar-2)">준</span></span><div class="nm">우리집 가계부<i data-lucide="chevrons-up-down"></i></div></div><div class="ib"><i data-lucide="settings"></i></div></div>
    <div class="scroll">
     <div class="card hero">
      <div class="month"><i data-lucide="chevron-left"></i>2026년 11월<i data-lucide="chevron-right"></i></div>
      <div class="lbl">11월 남은 돈</div>
      <div class="hero-amt money">1,284,500<span class="unit">원</span></div>
      <div class="trio num"><div><div class="k">수입</div><div class="v" style="color:var(--color-income)">5,620,000</div></div><div><div class="k">지출</div><div class="v">2,835,500</div></div><div><div class="k">저축</div><div class="v" style="color:var(--color-saving)">1,500,000</div></div></div>
     </div>
     <div class="card">
      <div class="sec"><b>누가 얼마나 썼나</b></div>
      <div class="split"><div style="width:49%;background:var(--color-member-1)"></div><div style="width:51%;background:var(--color-member-2)"></div></div>
      <div class="mrow num"><span class="dot" style="background:var(--color-member-1)"></span>민지<span class="amt">1,402,300원</span><span class="pct">49%</span></div>
      <div class="mrow num"><span class="dot" style="background:var(--color-member-2)"></span>준호<span class="amt">1,433,200원</span><span class="pct">51%</span></div>
     </div>
     <div class="card">
      <div class="sec"><b>어디에 썼나</b><a>전체</a></div>
      <div class="bar"><div class="t num"><span>식비</span><b>742,000원</b></div><div class="track"><div class="fill" style="width:100%"></div></div></div>
      <div class="bar"><div class="t num"><span>주거·통신</span><b>680,000원</b></div><div class="track"><div class="fill" style="width:92%"></div></div></div>
     </div>
    </div>
    <div class="tabbar"><div class="tab on"><span class="pill"><i data-lucide="house"></i></span>홈</div><div class="tab"><span class="pill"><i data-lucide="notebook-pen"></i></span>가계부</div><div class="plus" aria-label="내역 추가"><i data-lucide="plus"></i></div><div class="tab"><span class="pill"><i data-lucide="landmark"></i></span>자산</div></div>
   </div>
   <div class="phone">
    <div class="in-h"><div class="ib"><i data-lucide="x"></i></div><b>내역 입력</b><div style="width:44px"></div></div>
    <div class="seg"><span class="on">지출</span><span>수입</span><span>저축</span></div>
    <div class="amt-area"><div class="q">얼마를 썼나요?</div><div class="v money">12,800<span class="unit">원</span><span class="caret"></span></div><div class="ko">만 이천팔백 원</div></div>
    <div class="quick num"><span>+1천</span><span>+1만</span><span>+5만</span><span>+10만</span></div>
    <div class="rows">
     <div class="rw"><span class="k">카테고리</span><span class="v"><i data-lucide="utensils"></i>식비<i class="chev" data-lucide="chevron-right"></i></span></div>
     <div class="rw"><span class="k">주머니</span><span class="v">공동소비<i class="chev" data-lucide="chevron-right"></i></span></div>
     <div class="rw"><span class="k">쓴 사람</span><span class="v"><span class="av" style="background:var(--color-avatar-1)">민</span>민지<i class="chev" data-lucide="chevron-right"></i></span></div>
     <div class="rw num"><span class="k">날짜</span><span class="v">11월 6일 (금)<i class="chev" data-lucide="chevron-right"></i></span></div>
    </div>
    <div class="pad num"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>00</span><span>0</span><span><i data-lucide="delete"></i></span></div>
    <div class="save">저장</div>
   </div>
  </div>
  <div class="comps">
