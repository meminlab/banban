<!doctype html>
<html lang="ko" data-theme="clean">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 브라우저 막대·홈 화면 앱 상태 표시줄 색 = 헤더 surface (design.md 1.4). 라이트는 세 테마 공통, 다크는 테마마다
         (아래 스크립트와 src/app/theme.tsx 가 고른 테마 값으로 갈아 끼운다) -->
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B1E22" media="(prefers-color-scheme: dark)" />
    <!-- BANB-29: 첫 그리기 전에 기기에 저장한 테마를 붙인다(새로고침 때 클린이 잠깐 보이는 깜빡임 방지).
         키·값 목록·다크 색은 src/data/theme.ts·src/domain/theme.ts 와 같아야 한다(src/app/theme.test.tsx 가 검사) -->
    <script id="theme-boot">
      (function () {
        var dark = { clean: '#1B1E22', berry: '#1D1E21', cozy: '#221C1A' };
        var theme = 'clean';
        try {
          var saved = localStorage.getItem('banban.theme');
          if (saved && Object.prototype.hasOwnProperty.call(dark, saved)) theme = saved;
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"][media="(prefers-color-scheme: dark)"]');
        if (meta) meta.setAttribute('content', dark[theme]);
      })();
    </script>
    <title>반반 가계부</title>

    <!-- 홈 화면에 추가 (전체 화면 실행) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="반반" />
    <!-- default: 흰 바탕 검은 글자 상태 표시줄, 본문은 상태 표시줄 아래에서 시작 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
